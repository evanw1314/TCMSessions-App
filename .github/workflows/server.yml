name: server

on:
  push:
    paths: ["server/**", "testdata/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "testdata/**", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # conftest.py blanks every API key and points the database at a temp
      # file, so this needs no secrets and reaches no outside service.
      - run: python -m pytest
